openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: feed
    description: Feed operations
  - name: pets
    description: Pet operations
  - name: posts
    description: Post operations
  - name: uploads
    description: Upload operations
  - name: species
    description: Species and breed catalogue
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Get feed
      description: Returns recency-ordered posts with pet info, reaction counts, and viewer state
      security:
        - bearerAuth: []
      parameters:
        - name: nursery
          in: query
          required: false
          schema:
            type: boolean
          description: When true, returns only nursery (is_nursery=true) posts. Omit or false for the full feed.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /species:
    get:
      operationId: getSpecies
      tags: [species]
      summary: List all species
      description: Returns all species ordered by sort_order, each with a breed count.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeciesListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /species/{id}/breeds:
    get:
      operationId: getSpeciesByIdBreeds
      tags: [species]
      summary: List breeds for a species
      description: Returns all breeds for the given species, ordered alphabetically.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreedListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Species not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /follows/species/{id}:
    post:
      operationId: followSpecies
      tags: [species]
      summary: Follow a species
      description: >
        Records the authenticated user's interest in this species.
        Idempotent — following when already followed is a no-op.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestFollowResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Species not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unfollowSpecies
      tags: [species]
      summary: Unfollow a species
      description: >
        Removes the authenticated user's interest in this species.
        Idempotent — unfollowing when not following is a no-op.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestFollowResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /follows/breeds/{id}:
    post:
      operationId: followBreed
      tags: [species]
      summary: Follow a breed
      description: >
        Records the authenticated user's interest in this breed.
        Idempotent — following when already followed is a no-op.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestFollowResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Breed not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unfollowBreed
      tags: [species]
      summary: Unfollow a breed
      description: >
        Removes the authenticated user's interest in this breed.
        Idempotent — unfollowing when not following is a no-op.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestFollowResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/follows:
    get:
      operationId: getMyFollows
      tags: [pets]
      summary: Get caller's follow graph
      description: >
        Returns the authenticated user's full follow graph:
        packed pets (from pack_follows) and followed species/breeds
        (from interest_follows), for the Profile → Following management list.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyFollowsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pets/{id}/pack:
    post:
      operationId: joinPetPack
      tags: [pets]
      summary: Join a pet's Pack
      description: >
        Adds the authenticated user to this pet's Pack.
        Idempotent — joining when already in the Pack is a no-op and returns current state.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: leavePetPack
      tags: [pets]
      summary: Leave a pet's Pack
      description: >
        Removes the authenticated user from this pet's Pack.
        Idempotent — leaving when not in the Pack is a no-op and returns current state.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pets/{id}:
    get:
      operationId: getPet
      tags: [pets]
      summary: Get pet profile
      description: Returns a pet profile with its posts and reaction counts
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pets/{id}/pack-members:
    get:
      operationId: getPetPackMembers
      tags: [pets]
      summary: Get a pet's Pack members
      description: Returns the list of users who follow this pet, ordered by join date (oldest first).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackMembersResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{id}/boops:
    post:
      operationId: boopPost
      tags: [posts]
      summary: Boop a post
      description: Inserts one boop event (unlimited, no dedupe). Returns the new boop count.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoopResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{id}/treats:
    post:
      operationId: treatPost
      tags: [posts]
      summary: Treat a post
      description: >
        In a single transaction: checks daily treat limit (config.daily_treat_limit, default 5),
        rejects self-treats (caller owns the post's pet), then inserts and returns the new
        treat count plus remaining treats for today.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreatResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Self-treat not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Daily treat limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /uploads/presign:
    post:
      operationId: presignUpload
      tags: [uploads]
      summary: Get a presigned upload URL
      description: >
        Returns a short-lived presigned PUT URL for uploading directly to R2,
        plus the mediaKey to use when creating the post.
        contentType must be image/jpeg, image/png, or image/webp.
        sizeBytes must be ≤ 10 MB (10485760).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignResult"
        "400":
          description: Invalid content type or size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts:
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a post
      description: >
        Creates a post for a pet owned by the caller.
        Returns 403 if the pet is not owned by the caller.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostCreated"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Pet not owned by caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{id}:
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post
      description: >
        Deletes a post owned by the caller (via pet ownership).
        In a transaction, removes boops, treats, comments, and the post row.
        Best-effort deletes the R2 object (failures are logged, not propagated).
        Seed keys (seed:*) skip the R2 step. Returns 204 on success.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Post not owned by caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pets:
    post:
      operationId: createPet
      tags: [pets]
      summary: Create a pet
      description: Creates a new pet owned by the authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePetBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/pets:
    get:
      operationId: getMyPets
      tags: [pets]
      summary: Get caller's pets
      description: Returns all pets owned by the authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPetsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{id}/comments:
    get:
      operationId: getPostComments
      tags: [posts]
      summary: Get post comments
      description: Returns comments on a post ordered by creation time
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostComment"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createComment
      tags: [posts]
      summary: Post a comment
      description: Creates a comment on a post and returns it with the author's username.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostComment"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    PetSummary:
      type: object
      description: Minimal pet info embedded in feed posts
      properties:
        id:
          type: string
        name:
          type: string
        species:
          type: string
        breed:
          type: string
          nullable: true
        viewerInPack:
          type: boolean
          description: Whether the authenticated viewer is in this pet's Pack
        viewerOwnsPet:
          type: boolean
          description: Whether the authenticated viewer owns this pet
      required:
        - id
        - name
        - species
        - viewerInPack
        - viewerOwnsPet

    ViewerInfo:
      type: object
      description: Viewer-specific state returned with the feed
      properties:
        treatsRemainingToday:
          type: integer
      required:
        - treatsRemainingToday

    FeedPost:
      type: object
      description: A post in the feed with reaction counts and viewer state
      properties:
        id:
          type: string
        caption:
          type: string
          nullable: true
        mediaKey:
          type: string
        mediaUrl:
          type: string
          nullable: true
          description: Presigned GET URL for R2 keys; null for seed keys (resolved locally by the client).
        cropFocusX:
          type: number
          format: float
          nullable: true
          description: Horizontal focal point (0–1) for cover-crop rendering. null = center.
        cropFocusY:
          type: number
          format: float
          nullable: true
          description: Vertical focal point (0–1) for cover-crop rendering. null = center.
        isNursery:
          type: boolean
        createdAt:
          type: string
          format: date-time
        pet:
          $ref: "#/components/schemas/PetSummary"
        boopCount:
          type: integer
        treatCount:
          type: integer
        commentCount:
          type: integer
        viewerHasBooped:
          type: boolean
        viewerHasTreated:
          type: boolean
      required:
        - id
        - mediaKey
        - mediaUrl
        - cropFocusX
        - cropFocusY
        - isNursery
        - createdAt
        - pet
        - boopCount
        - treatCount
        - commentCount
        - viewerHasBooped
        - viewerHasTreated

    FeedResponse:
      type: object
      description: Feed response wrapping posts and viewer state
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/FeedPost"
        viewer:
          $ref: "#/components/schemas/ViewerInfo"
      required:
        - posts
        - viewer

    PetProfile:
      type: object
      description: Full pet profile including posts
      properties:
        id:
          type: string
        name:
          type: string
        species:
          type: string
        breed:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        speciesId:
          type: string
          nullable: true
          description: FK to species catalogue; null if pet was created without catalogue selection
        breedId:
          type: string
          nullable: true
          description: FK to breeds catalogue; null if pet was created without catalogue selection
        packCount:
          type: integer
          description: Number of users who have this pet in their Pack
        viewerInPack:
          type: boolean
          description: Whether the authenticated viewer is in this pet's Pack
        viewerFollowsSpecies:
          type: boolean
          nullable: true
          description: Whether the viewer follows this pet's species. Null when speciesId is null.
        viewerFollowsBreed:
          type: boolean
          nullable: true
          description: Whether the viewer follows this pet's breed. Null when breedId is null.
        posts:
          type: array
          items:
            $ref: "#/components/schemas/FeedPost"
      required:
        - id
        - name
        - species
        - packCount
        - viewerInPack
        - viewerFollowsSpecies
        - viewerFollowsBreed
        - posts

    PackResult:
      type: object
      description: Result of a pack join or leave action
      properties:
        packCount:
          type: integer
          description: Current number of users in this pet's Pack
        viewerInPack:
          type: boolean
          description: Whether the viewer is now in the Pack
      required:
        - packCount
        - viewerInPack

    PostComment:
      type: object
      description: A comment on a post
      properties:
        id:
          type: string
        text:
          type: string
        authorUsername:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - text
        - authorUsername
        - createdAt

    CommentBody:
      type: object
      description: Request body for creating a comment
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 280
      required:
        - text

    Pet:
      type: object
      description: A pet owned by a user
      properties:
        id:
          type: string
        ownerId:
          type: string
        name:
          type: string
        species:
          type: string
        breed:
          type: string
          nullable: true
        speciesId:
          type: string
          nullable: true
        breedId:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - ownerId
        - name
        - species
        - speciesId
        - breedId
        - createdAt

    SpeciesItem:
      type: object
      description: A species entry with breed count
      properties:
        id:
          type: string
        name:
          type: string
        sortOrder:
          type: integer
        breedCount:
          type: integer
      required:
        - id
        - name
        - sortOrder
        - breedCount

    SpeciesListResponse:
      type: object
      properties:
        species:
          type: array
          items:
            $ref: "#/components/schemas/SpeciesItem"
      required:
        - species

    BreedItem:
      type: object
      description: A breed entry
      properties:
        id:
          type: string
        speciesId:
          type: string
        name:
          type: string
      required:
        - id
        - speciesId
        - name

    BreedListResponse:
      type: object
      properties:
        breeds:
          type: array
          items:
            $ref: "#/components/schemas/BreedItem"
      required:
        - breeds

    CreatePetBody:
      type: object
      description: Request body for creating a pet
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        species:
          type: string
          minLength: 1
          maxLength: 50
          description: >
            Free-text species name. Required when speciesId is not provided.
            When speciesId is provided the server derives this from the FK and
            the client-supplied value is ignored.
        speciesId:
          type: string
          nullable: true
          description: FK to the species catalogue. When set the server mirrors the species name into the legacy text column.
        breed:
          type: string
          maxLength: 100
          description: >
            Free-text breed/kind. Used for the "Not listed" path.
            When breedId is provided the server derives this from the FK.
        breedId:
          type: string
          nullable: true
          description: FK to the breeds catalogue. When set the server mirrors the breed name into the legacy text column.
        bio:
          type: string
          maxLength: 280
      required:
        - name

    MyPetsResponse:
      type: object
      description: The caller's pets
      properties:
        pets:
          type: array
          items:
            $ref: "#/components/schemas/Pet"
      required:
        - pets

    PresignBody:
      type: object
      description: Request body for obtaining a presigned upload URL
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
      required:
        - contentType
        - sizeBytes

    PresignResult:
      type: object
      description: Presigned PUT URL and the media key to use when creating the post
      properties:
        uploadUrl:
          type: string
        mediaKey:
          type: string
      required:
        - uploadUrl
        - mediaKey

    CreatePostBody:
      type: object
      description: Request body for creating a post
      properties:
        petId:
          type: string
        mediaKey:
          type: string
        caption:
          type: string
          maxLength: 280
        isNursery:
          type: boolean
        cropFocusX:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: Horizontal focal point (0–1). null or omitted = center.
        cropFocusY:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: Vertical focal point (0–1). null or omitted = center.
      required:
        - petId
        - mediaKey

    PostCreated:
      type: object
      description: The newly created post
      properties:
        id:
          type: string
        petId:
          type: string
        mediaKey:
          type: string
        caption:
          type: string
          nullable: true
        isNursery:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - petId
        - mediaKey
        - isNursery
        - createdAt

    InterestFollowResult:
      type: object
      description: Result of a species or breed follow/unfollow action
      properties:
        viewerFollows:
          type: boolean
          description: Whether the viewer now follows this species or breed
      required:
        - viewerFollows

    PackedPetItem:
      type: object
      description: A pet in the caller's Pack (from pack_follows), used in the follows management list
      properties:
        id:
          type: string
        name:
          type: string
        species:
          type: string
        breed:
          type: string
          nullable: true
        speciesId:
          type: string
          nullable: true
        breedId:
          type: string
          nullable: true
      required:
        - id
        - name
        - species

    FollowedSpeciesItem:
      type: object
      description: A species the caller follows
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name

    FollowedBreedItem:
      type: object
      description: A breed the caller follows, with its parent species name
      properties:
        id:
          type: string
        name:
          type: string
        speciesId:
          type: string
        speciesName:
          type: string
      required:
        - id
        - name
        - speciesId
        - speciesName

    MyFollowsResponse:
      type: object
      description: The caller's full follow graph — packed pets, followed species, followed breeds
      properties:
        packedPets:
          type: array
          items:
            $ref: "#/components/schemas/PackedPetItem"
        followedSpecies:
          type: array
          items:
            $ref: "#/components/schemas/FollowedSpeciesItem"
        followedBreeds:
          type: array
          items:
            $ref: "#/components/schemas/FollowedBreedItem"
      required:
        - packedPets
        - followedSpecies
        - followedBreeds

    BoopResult:
      type: object
      description: Result of a boop action
      properties:
        boopCount:
          type: integer
      required:
        - boopCount

    TreatResult:
      type: object
      description: Result of a treat action
      properties:
        treatCount:
          type: integer
        treatsRemainingToday:
          type: integer
      required:
        - treatCount
        - treatsRemainingToday

    PackMemberItem:
      type: object
      description: A single member of a pet's Pack
      properties:
        username:
          type: string
        joinedAt:
          type: string
          format: date-time
      required:
        - username
        - joinedAt

    PackMembersResponse:
      type: object
      description: All members of a pet's Pack
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/PackMemberItem"
      required:
        - members
