openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: feed
    description: Feed operations
  - name: pets
    description: Pet operations
  - name: posts
    description: Post operations
  - name: uploads
    description: Upload operations
  - name: species
    description: Species and breed catalogue
  - name: users
    description: Owner profile operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Get feed
      description: Returns recency-ordered posts with pet info, reaction counts, and viewer state
      security:
        - bearerAuth: []
      parameters:
        - name: nursery
          in: query
          required: false
          schema:
            type: boolean
          description: When true, returns only nursery (is_nursery=true) posts. Omit or false for the full feed.
        - name: speciesId
          in: query
          required: false
          schema:
            type: string
          description: When set, returns only posts from pets of this species (by catalogue species UUID). Combinable with nursery. Omit for all species.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [fresh, popular]
          description: >
            Sort order for the feed. "fresh" (default) returns posts newest-first
            (current behaviour — Home and Nursery always use this default).
            "popular" orders by a 7-day engagement score
            (boops_7d + 3 × treats_7d), descending, tiebroken by created_at desc
            so zero-score posts still read newest-first.
            Combinable with speciesId and nursery; archived exclusion unchanged.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /species:
    get:
      operationId: getSpecies
      tags: [species]
      summary: List all species
      description: Returns all species ordered by sort_order, each with a breed count.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeciesListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /species/{id}/breeds:
    get:
      operationId: getSpeciesByIdBreeds
      tags: [species]
      summary: List breeds for a species
      description: Returns all breeds for the given species, ordered alphabetically.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreedListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Species not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /follows/species/{id}:
    post:
      operationId: followSpecies
      tags: [species]
      summary: Follow a species
      description: >
        Records the authenticated user's interest in this species.
        Idempotent — following when already followed is a no-op.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestFollowResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Species not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unfollowSpecies
      tags: [species]
      summary: Unfollow a species
      description: >
        Removes the authenticated user's interest in this species.
        Idempotent — unfollowing when not following is a no-op.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestFollowResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /follows/breeds/{id}:
    post:
      operationId: followBreed
      tags: [species]
      summary: Follow a breed
      description: >
        Records the authenticated user's interest in this breed.
        Idempotent — following when already followed is a no-op.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestFollowResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Breed not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unfollowBreed
      tags: [species]
      summary: Unfollow a breed
      description: >
        Removes the authenticated user's interest in this breed.
        Idempotent — unfollowing when not following is a no-op.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestFollowResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/follows:
    get:
      operationId: getMyFollows
      tags: [pets]
      summary: Get caller's follow graph
      description: >
        Returns the authenticated user's full follow graph:
        packed pets (from pack_follows) and followed species/breeds
        (from interest_follows), for the Profile → Following management list.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyFollowsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pets/{id}/pack:
    post:
      operationId: joinPetPack
      tags: [pets]
      summary: Join a pet's Pack
      description: >
        Adds the authenticated user to this pet's Pack.
        Idempotent — joining when already in the Pack is a no-op and returns current state.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: leavePetPack
      tags: [pets]
      summary: Leave a pet's Pack
      description: >
        Removes the authenticated user from this pet's Pack.
        Idempotent — leaving when not in the Pack is a no-op and returns current state.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pets/{id}/avatar:
    patch:
      operationId: patchPetAvatar
      tags: [pets]
      summary: Set or clear a pet's avatar
      description: >
        Sets or clears the avatar for a pet owned by the caller.
        When avatarKey starts with "posts/", the server copies the object to an
        "avatars/" key so the avatar is never orphaned if the source post is deleted.
        Pass null for all fields to clear the avatar (reverts hero to latest-post fallback).
        403 unless the caller owns the pet.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarPatchBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarPatchResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Pet not owned by caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pets/{id}:
    patch:
      operationId: patchPet
      tags: [pets]
      summary: Update a pet's profile
      description: >
        Updates one or more profile fields for a pet owned by the caller.
        All body fields are optional; omitted fields are left unchanged.
        Setting bio to null clears it.
        Providing speciesId causes the server to resolve the authoritative species name
        from the catalogue (preventing client-side name drift) and clears the existing
        breed — send breedId or breed in the same request to set a new one.
        Providing breedId causes the server to resolve the authoritative breed name.
        Setting breedId to null clears the breed FK; optionally pair with breed for
        free-text ("Not listed") path.
        Returns the updated Pet (without post lists; client invalidates the profile query).
        403 unless the caller owns the pet.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetPatchBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the pet's owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getPet
      tags: [pets]
      summary: Get pet profile
      description: Returns a pet profile with its posts and reaction counts
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePet
      tags: [pets]
      summary: Soft-delete a pet
      description: >
        Soft-deletes a pet by setting deleted_at = now(). Primary owner only.
        All posts, pack follows, and other pet data become invisible immediately;
        a background purge job hard-deletes everything after 30 days.
        Audit-logged. Returns 204 on success.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the primary owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pets/{id}/pack-members:
    get:
      operationId: getPetPackMembers
      tags: [pets]
      summary: Get a pet's Pack members
      description: Returns the list of users who follow this pet, ordered by join date (oldest first).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackMembersResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{id}/boops:
    post:
      operationId: boopPost
      tags: [posts]
      summary: Boop a post
      description: Inserts one boop event (unlimited, no dedupe). Returns the new boop count.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoopResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{id}/treats:
    post:
      operationId: treatPost
      tags: [posts]
      summary: Treat a post
      description: >
        In a single transaction: checks daily treat limit (config.daily_treat_limit, default 5),
        rejects self-treats (caller owns the post's pet), then inserts and returns the new
        treat count plus remaining treats for today.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreatResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Self-treat not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Daily treat limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /uploads/verify:
    post:
      operationId: verifyUpload
      tags: [uploads]
      summary: Verify an uploaded file's magic bytes
      description: >
        After the client PUTs a file directly to R2 via the presigned URL, call
        this endpoint to verify that the file's actual binary signature matches
        an allowed image type (JPEG, PNG, or WebP). If the check fails the object
        is deleted from R2 and a 400 is returned. Must be called before using
        the mediaKey in a post or avatar update.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyUploadBody"
      responses:
        "200":
          description: File is a valid image
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "400":
          description: File failed magic-byte check or mediaKey is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /uploads/presign-avatar:
    post:
      operationId: presignAvatarUpload
      tags: [uploads]
      summary: Get a presigned upload URL for an avatar
      description: >
        Returns a short-lived presigned PUT URL for uploading directly to R2,
        plus the mediaKey (under the "avatars/" prefix) to pass to PATCH /pets/{id}/avatar.
        Same validation as /uploads/presign (contentType, sizeBytes).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignResult"
        "400":
          description: Invalid content type or size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /uploads/presign:
    post:
      operationId: presignUpload
      tags: [uploads]
      summary: Get a presigned upload URL
      description: >
        Returns a short-lived presigned PUT URL for uploading directly to R2,
        plus the mediaKey to use when creating the post.
        contentType must be image/jpeg, image/png, or image/webp.
        sizeBytes must be ≤ 10 MB (10485760).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignResult"
        "400":
          description: Invalid content type or size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts:
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a post
      description: >
        Creates a post for a pet owned by the caller.
        Returns 403 if the pet is not owned by the caller.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostCreated"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Pet not owned by caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{id}:
    patch:
      operationId: patchPost
      tags: [posts]
      summary: Update a post
      description: >
        Updates caption and/or isNursery on a post owned by the caller
        (ownership checked via the post's pet). caption may be set, changed,
        or cleared to null. Omitted fields are left unchanged.
        403 unless the caller owns the post's pet.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchPostBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchPostResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Post not owned by caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post
      description: >
        Deletes a post owned by the caller (via pet ownership).
        In a transaction, removes boops, treats, comments, and the post row.
        Best-effort deletes the R2 object (failures are logged, not propagated).
        Seed keys (seed:*) skip the R2 step. Returns 204 on success.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Post not owned by caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{id}/archive:
    post:
      operationId: archivePost
      tags: [posts]
      summary: Archive a post
      description: >
        Sets archived_at on a post owned by the caller. Idempotent — calling
        twice leaves the post archived. 403 unless the caller owns the post's pet.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchivePostResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Post not owned by caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{id}/unarchive:
    post:
      operationId: unarchivePost
      tags: [posts]
      summary: Unarchive a post
      description: >
        Clears archived_at on a post owned by the caller, restoring it on all
        public surfaces. Idempotent. Reactions, comments, and media are intact.
        403 unless caller owns the pet.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unarchived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchivePostResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Post not owned by caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pets:
    post:
      operationId: createPet
      tags: [pets]
      summary: Create a pet
      description: Creates a new pet owned by the authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePetBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get the signed-in user's profile
      description: Returns the owner profile fields for the authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: patchMe
      tags: [users]
      summary: Update the signed-in user's profile
      description: >
        Updates one or more owner profile fields for the authenticated user.
        Merge semantics — only provided fields change; omitted fields are left unchanged.
        All validation is server-side. Username is lowercased before storing.
        Returns 409 if the username is already taken (case-insensitively).
        Returns 400 for any other validation failure (format, reserved word, length).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MePatchBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/pets:
    get:
      operationId: getMyPets
      tags: [pets]
      summary: Get caller's pets
      description: Returns all pets owned by the authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPetsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{id}/comments/{commentId}:
    delete:
      operationId: deleteComment
      tags: [posts]
      summary: Delete own comment
      description: >
        Soft-deletes a comment by setting deleted_at. Only the comment author
        may delete their own comment; the post owner cannot delete others'
        comments via this endpoint (use admin hide for moderation).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the comment author
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{id}/pets/{petId}:
    post:
      operationId: addPostPetTag
      tags: [posts]
      summary: Add a pet tag to an existing post
      description: >
        Adds a pet tag to an already-published post.
        Caller must be the original poster of the post.
        Subject to the same block guard as POST /posts —
        if the pet's owner has blocked the caller (or vice versa), returns 403.
        Idempotent: tagging the same pet twice is a no-op (201 returned either way).
        Sends a pet_tagged notification to the pet's owner when the pet is
        not owned by the caller.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Post ID
        - name: petId
          in: path
          required: true
          schema:
            type: string
          description: Pet ID to tag
      responses:
        "201":
          description: Tag added (or already existed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the post's author, or a block relationship exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post or pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removePostPetTag
      tags: [posts]
      summary: Remove a pet tag from a post
      description: >
        Removes a specific pet's tag from a post.
        Allowed for EITHER the pet's owner OR the post's original poster (403 otherwise).
        The post itself is not deleted.
        Returns 400 if this is the last tag on the post.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Post ID
        - name: petId
          in: path
          required: true
          schema:
            type: string
          description: Pet ID to untag
      responses:
        "204":
          description: Tag removed
        "400":
          description: Cannot remove the last tag on a post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Viewer does not own this pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post or tag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pets/search:
    get:
      operationId: searchPets
      tags: [pets]
      summary: Search pets by name or owner username
      description: >
        Returns up to 20 pets matching the query against pet name OR owner username.
        Own pets are returned first. Used by the compose flow pet-tagging step.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query (min 1 character)
        - name: exclude
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated pet IDs to exclude from results
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pets:
                    type: array
                    items:
                      $ref: "#/components/schemas/PetSearchResult"
                required:
                  - pets
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get in-app notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/read-all:
    patch:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Marked as read
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{id}/comments:
    get:
      operationId: getPostComments
      tags: [posts]
      summary: Get post comments
      description: Returns comments on a post ordered by creation time
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostComment"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createComment
      tags: [posts]
      summary: Post a comment
      description: Creates a comment on a post and returns it with the author's username.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostComment"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    PetSummary:
      type: object
      description: Minimal pet info embedded in feed posts
      properties:
        id:
          type: string
        name:
          type: string
        species:
          type: string
        breed:
          type: string
          nullable: true
        speciesId:
          type: string
          nullable: true
          description: FK to the species catalogue; null if pet was created without catalogue selection.
        viewerInPack:
          type: boolean
          description: Whether the authenticated viewer is in this pet's Pack
        viewerOwnsPet:
          type: boolean
          description: Whether the authenticated viewer owns this pet
        ownerId:
          type: string
          description: Clerk user ID of the primary owner — used for remove-tag permission checks.
      required:
        - id
        - name
        - species
        - speciesId
        - viewerInPack
        - viewerOwnsPet
        - ownerId

    ViewerInfo:
      type: object
      description: Viewer-specific state returned with the feed
      properties:
        treatsRemainingToday:
          type: integer
      required:
        - treatsRemainingToday

    FeedPost:
      type: object
      description: A post in the feed with reaction counts and viewer state
      properties:
        id:
          type: string
        caption:
          type: string
          nullable: true
        mediaKey:
          type: string
        mediaUrl:
          type: string
          nullable: true
          description: Presigned GET URL for R2 keys; null for seed keys (resolved locally by the client).
        cropFocusX:
          type: number
          format: float
          nullable: true
          description: Horizontal focal point (0–1) for cover-crop rendering. null = center.
        cropFocusY:
          type: number
          format: float
          nullable: true
          description: Vertical focal point (0–1) for cover-crop rendering. null = center.
        cropMode:
          type: string
          nullable: true
          description: "'cover' or 'contain'. null = legacy cover behavior."
        cropX:
          type: number
          format: float
          nullable: true
          description: Crop rect left edge as fraction of original width.
        cropY:
          type: number
          format: float
          nullable: true
          description: Crop rect top edge as fraction of original height.
        cropW:
          type: number
          format: float
          nullable: true
          description: Crop rect width as fraction of original width.
        cropH:
          type: number
          format: float
          nullable: true
          description: Crop rect height as fraction of original height.
        isNursery:
          type: boolean
        createdAt:
          type: string
          format: date-time
        pet:
          $ref: "#/components/schemas/PetSummary"
        boopCount:
          type: integer
        treatCount:
          type: integer
        commentCount:
          type: integer
        viewerHasBooped:
          type: boolean
        viewerHasTreated:
          type: boolean
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when the post is archived; null when active.
        taggedPets:
          type: array
          items:
            $ref: "#/components/schemas/TaggedPet"
          description: All pets tagged in this post (including the primary). Use this array for display.
      required:
        - id
        - mediaKey
        - mediaUrl
        - cropFocusX
        - cropFocusY
        - isNursery
        - archivedAt
        - createdAt
        - pet
        - taggedPets
        - boopCount
        - treatCount
        - commentCount
        - viewerHasBooped
        - viewerHasTreated

    FeedResponse:
      type: object
      description: Feed response wrapping posts and viewer state
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/FeedPost"
        viewer:
          $ref: "#/components/schemas/ViewerInfo"
      required:
        - posts
        - viewer

    PetProfile:
      type: object
      description: Full pet profile including posts
      properties:
        id:
          type: string
        name:
          type: string
        species:
          type: string
        breed:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        speciesId:
          type: string
          nullable: true
          description: FK to species catalogue; null if pet was created without catalogue selection
        breedId:
          type: string
          nullable: true
          description: FK to breeds catalogue; null if pet was created without catalogue selection
        packCount:
          type: integer
          description: Number of users who have this pet in their Pack
        viewerInPack:
          type: boolean
          description: Whether the authenticated viewer is in this pet's Pack
        viewerFollowsSpecies:
          type: boolean
          nullable: true
          description: Whether the viewer follows this pet's species. Null when speciesId is null.
        viewerFollowsBreed:
          type: boolean
          nullable: true
          description: Whether the viewer follows this pet's breed. Null when breedId is null.
        posts:
          type: array
          items:
            $ref: "#/components/schemas/FeedPost"
        archivedPosts:
          type: array
          items:
            $ref: "#/components/schemas/FeedPost"
          description: >
            Archived posts for this pet. Populated only when the viewer is the
            owner; always an empty array for non-owners.
        viewerOwnsPet:
          type: boolean
          description: Whether the authenticated viewer owns this pet.
        avatarUrl:
          type: string
          nullable: true
          description: Stable media URL for the pet's avatar. Null when no avatar is set.
        avatarFocusX:
          type: number
          format: float
          nullable: true
          description: Horizontal focal point (0–1) for avatar cover-crop. Null when no avatar.
        avatarFocusY:
          type: number
          format: float
          nullable: true
          description: Vertical focal point (0–1) for avatar cover-crop. Null when no avatar.
      required:
        - id
        - name
        - species
        - packCount
        - viewerInPack
        - viewerFollowsSpecies
        - viewerFollowsBreed
        - posts
        - archivedPosts
        - viewerOwnsPet
        - avatarUrl
        - avatarFocusX
        - avatarFocusY

    ArchivePostResponse:
      type: object
      description: Result of an archive or unarchive action
      properties:
        id:
          type: string
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: The new archived_at timestamp; null when the post has been unarchived.
      required:
        - id
        - archivedAt

    PackResult:
      type: object
      description: Result of a pack join or leave action
      properties:
        packCount:
          type: integer
          description: Current number of users in this pet's Pack
        viewerInPack:
          type: boolean
          description: Whether the viewer is now in the Pack
      required:
        - packCount
        - viewerInPack

    PostComment:
      type: object
      description: A comment on a post
      properties:
        id:
          type: string
        text:
          type: string
        authorUsername:
          type: string
        authorId:
          type: string
          description: Clerk user ID of the comment author — used by clients to determine ownership.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - text
        - authorUsername
        - authorId
        - createdAt

    CommentBody:
      type: object
      description: Request body for creating a comment
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 280
      required:
        - text

    PetPatchBody:
      type: object
      description: >
        Fields to update on a pet's profile. All fields are optional; omitted fields are
        left unchanged. Set bio to null to clear it. Set breedId to null (with no breed
        string) to clear the breed. When speciesId is provided the server mirrors the
        authoritative name and clears the existing breed — send breedId or breed in the
        same request to set a new one for the new species.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Pet's display name.
        bio:
          type: string
          nullable: true
          description: Bio text. Null clears the bio.
        speciesId:
          type: string
          description: FK to the species catalogue. Server resolves authoritative name.
        breedId:
          type: string
          nullable: true
          description: >
            FK to the breeds catalogue. Server resolves authoritative name.
            Null clears the FK breed link (pair with breed for free-text path).
        breed:
          type: string
          nullable: true
          description: >
            Free-text breed for the "Not listed" path. Used when breedId is absent or null.
            Null clears the free-text breed.

    AvatarPatchBody:
      type: object
      description: >
        Request body for setting or clearing a pet's avatar.
        Set avatarKey to null to clear the avatar.
      properties:
        avatarKey:
          type: string
          nullable: true
          description: >
            R2 media key for the new avatar. If it starts with "posts/", the server
            copies it to an "avatars/" key. Pass null to clear the avatar.
        focusX:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
        focusY:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
      required:
        - avatarKey
        - focusX
        - focusY

    AvatarPatchResponse:
      type: object
      description: Result of a pet avatar set or clear operation
      properties:
        avatarUrl:
          type: string
          nullable: true
        avatarFocusX:
          type: number
          format: float
          nullable: true
        avatarFocusY:
          type: number
          format: float
          nullable: true
      required:
        - avatarUrl
        - avatarFocusX
        - avatarFocusY

    Pet:
      type: object
      description: A pet owned by a user
      properties:
        id:
          type: string
        ownerId:
          type: string
        name:
          type: string
        species:
          type: string
        breed:
          type: string
          nullable: true
        speciesId:
          type: string
          nullable: true
        breedId:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        thumbnailUrl:
          type: string
          nullable: true
          description: >
            Stable media URL for the pet's avatar (preferred) or most recent
            non-archived post. Null when neither exists or when the source key
            is a seed key (resolved client-side from bundled assets).
        avatarUrl:
          type: string
          nullable: true
          description: Stable media URL for the pet's avatar. Null when no avatar is set.
        avatarFocusX:
          type: number
          format: float
          nullable: true
          description: Horizontal focal point (0–1) for avatar cover-crop. Null when no avatar.
        avatarFocusY:
          type: number
          format: float
          nullable: true
          description: Vertical focal point (0–1) for avatar cover-crop. Null when no avatar.
      required:
        - id
        - ownerId
        - name
        - species
        - speciesId
        - breedId
        - createdAt
        - thumbnailUrl
        - avatarUrl
        - avatarFocusX
        - avatarFocusY

    SpeciesItem:
      type: object
      description: A species entry with breed count
      properties:
        id:
          type: string
        name:
          type: string
        sortOrder:
          type: integer
        breedCount:
          type: integer
      required:
        - id
        - name
        - sortOrder
        - breedCount

    SpeciesListResponse:
      type: object
      properties:
        species:
          type: array
          items:
            $ref: "#/components/schemas/SpeciesItem"
      required:
        - species

    BreedItem:
      type: object
      description: A breed entry
      properties:
        id:
          type: string
        speciesId:
          type: string
        name:
          type: string
      required:
        - id
        - speciesId
        - name

    BreedListResponse:
      type: object
      properties:
        breeds:
          type: array
          items:
            $ref: "#/components/schemas/BreedItem"
      required:
        - breeds

    CreatePetBody:
      type: object
      description: Request body for creating a pet
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        species:
          type: string
          minLength: 1
          maxLength: 50
          description: >
            Free-text species name. Required when speciesId is not provided.
            When speciesId is provided the server derives this from the FK and
            the client-supplied value is ignored.
        speciesId:
          type: string
          nullable: true
          description: FK to the species catalogue. When set the server mirrors the species name into the legacy text column.
        breed:
          type: string
          maxLength: 100
          description: >
            Free-text breed/kind. Used for the "Not listed" path.
            When breedId is provided the server derives this from the FK.
        breedId:
          type: string
          nullable: true
          description: FK to the breeds catalogue. When set the server mirrors the breed name into the legacy text column.
        bio:
          type: string
          maxLength: 280
      required:
        - name

    MyPetsResponse:
      type: object
      description: The caller's pets
      properties:
        pets:
          type: array
          items:
            $ref: "#/components/schemas/Pet"
      required:
        - pets

    VerifyUploadBody:
      type: object
      description: Request body for verifying an uploaded file's magic bytes
      properties:
        mediaKey:
          type: string
          description: The mediaKey returned by /uploads/presign or /uploads/presign-avatar (must start with posts/ or avatars/)
      required:
        - mediaKey

    PresignBody:
      type: object
      description: Request body for obtaining a presigned upload URL
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
      required:
        - contentType
        - sizeBytes

    PresignResult:
      type: object
      description: Presigned PUT URL and the media key to use when creating the post
      properties:
        uploadUrl:
          type: string
        mediaKey:
          type: string
      required:
        - uploadUrl
        - mediaKey

    TaggedPet:
      type: object
      description: A pet tagged in a post, with viewer ownership state
      properties:
        id:
          type: string
        name:
          type: string
        ownerId:
          type: string
          description: Clerk user ID of the pet's primary owner
        viewerOwnsPet:
          type: boolean
          description: Whether the authenticated viewer is an owner of this pet
        avatarUrl:
          type: string
          nullable: true
      required:
        - id
        - name
        - ownerId
        - viewerOwnsPet

    PetSearchResult:
      type: object
      description: Pet returned by the /pets/search endpoint
      properties:
        id:
          type: string
        name:
          type: string
        species:
          type: string
        ownerId:
          type: string
        ownerUsername:
          type: string
        avatarUrl:
          type: string
          nullable: true
        thumbnailUrl:
          type: string
          nullable: true
      required:
        - id
        - name
        - species
        - ownerId
        - ownerUsername

    NotificationItem:
      type: object
      description: In-app notification entry
      properties:
        id:
          type: string
        type:
          type: string
          description: "'pet_tagged'"
        postId:
          type: string
          nullable: true
        petId:
          type: string
          nullable: true
        petName:
          type: string
          nullable: true
        actorUsername:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - type
        - createdAt

    NotificationsResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/NotificationItem"
        unreadCount:
          type: integer
      required:
        - notifications
        - unreadCount

    CreatePostBody:
      type: object
      description: Request body for creating a post
      properties:
        petIds:
          type: array
          items:
            type: string
          minItems: 1
          description: >
            IDs of pets to tag. The first element is the primary pet (shown as the
            post author). Caller must own the primary pet. Additional pets can be
            anyone's pet — tags are live immediately with no approval required.
        mediaKey:
          type: string
        caption:
          type: string
          maxLength: 250
        isNursery:
          type: boolean
        cropFocusX:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: Horizontal focal point (0–1). null or omitted = center.
        cropFocusY:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: Vertical focal point (0–1). null or omitted = center.
        cropMode:
          type: string
          nullable: true
          description: "'cover' (default) or 'contain'. null = default cover."
        cropX:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: Crop rect left edge as fraction of original width.
        cropY:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: Crop rect top edge as fraction of original height.
        cropW:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: Crop rect width as fraction of original width.
        cropH:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: Crop rect height as fraction of original height.
      required:
        - petIds
        - mediaKey

    PostCreated:
      type: object
      description: The newly created post
      properties:
        id:
          type: string
        petIds:
          type: array
          items:
            type: string
          description: All tagged pet IDs, primary first.
        mediaKey:
          type: string
        caption:
          type: string
          nullable: true
        isNursery:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - petIds
        - mediaKey
        - isNursery
        - createdAt

    PatchPostBody:
      type: object
      description: Fields to update on an existing post. Omitted fields are unchanged.
      properties:
        caption:
          type: string
          nullable: true
          maxLength: 250
          description: New caption; null clears it.
        isNursery:
          type: boolean
          description: Whether this is a Nursery (baby/hatchling) post.

    PatchPostResponse:
      type: object
      required: [id, caption, isNursery]
      properties:
        id:
          type: string
        caption:
          type: string
          nullable: true
        isNursery:
          type: boolean

    InterestFollowResult:
      type: object
      description: Result of a species or breed follow/unfollow action
      properties:
        viewerFollows:
          type: boolean
          description: Whether the viewer now follows this species or breed
      required:
        - viewerFollows

    PackedPetItem:
      type: object
      description: A pet in the caller's Pack (from pack_follows), used in the follows management list
      properties:
        id:
          type: string
        name:
          type: string
        species:
          type: string
        breed:
          type: string
          nullable: true
        speciesId:
          type: string
          nullable: true
        breedId:
          type: string
          nullable: true
        thumbnailUrl:
          type: string
          nullable: true
          description: >
            Stable media URL for the pet's most recent non-archived post.
            Null when the pet has no posts or when the most recent post uses
            a seed key (resolved client-side from bundled assets).
      required:
        - id
        - name
        - species
        - thumbnailUrl

    FollowedSpeciesItem:
      type: object
      description: A species the caller follows
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name

    FollowedBreedItem:
      type: object
      description: A breed the caller follows, with its parent species name
      properties:
        id:
          type: string
        name:
          type: string
        speciesId:
          type: string
        speciesName:
          type: string
      required:
        - id
        - name
        - speciesId
        - speciesName

    MyFollowsResponse:
      type: object
      description: The caller's full follow graph — packed pets, followed species, followed breeds
      properties:
        packedPets:
          type: array
          items:
            $ref: "#/components/schemas/PackedPetItem"
        followedSpecies:
          type: array
          items:
            $ref: "#/components/schemas/FollowedSpeciesItem"
        followedBreeds:
          type: array
          items:
            $ref: "#/components/schemas/FollowedBreedItem"
      required:
        - packedPets
        - followedSpecies
        - followedBreeds

    BoopResult:
      type: object
      description: Result of a boop action
      properties:
        boopCount:
          type: integer
      required:
        - boopCount

    TreatResult:
      type: object
      description: Result of a treat action
      properties:
        treatCount:
          type: integer
        treatsRemainingToday:
          type: integer
      required:
        - treatCount
        - treatsRemainingToday

    PackMemberItem:
      type: object
      description: A single member of a pet's Pack
      properties:
        username:
          type: string
        joinedAt:
          type: string
          format: date-time
      required:
        - username
        - joinedAt

    PackMembersResponse:
      type: object
      description: All members of a pet's Pack
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/PackMemberItem"
      required:
        - members

    MeProfile:
      type: object
      description: The signed-in owner's profile fields
      properties:
        id:
          type: string
        username:
          type: string
          nullable: true
          description: Chosen username (lowercase). Null until explicitly set.
        displayName:
          type: string
          nullable: true
          description: Owner's display name shown on their profile.
        locationCity:
          type: string
          nullable: true
          description: City or location, plain text.
        about:
          type: string
          nullable: true
          description: Short bio about the owner (max 200 chars).
        instagram:
          type: string
          nullable: true
          description: Instagram profile URL.
        facebook:
          type: string
          nullable: true
          description: Facebook profile URL.
        linkedin:
          type: string
          nullable: true
          description: LinkedIn profile URL.
        xTwitter:
          type: string
          nullable: true
          description: X (Twitter) profile URL.
        tiktok:
          type: string
          nullable: true
          description: TikTok profile URL.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - displayName
        - locationCity
        - about
        - instagram
        - facebook
        - linkedin
        - xTwitter
        - tiktok
        - createdAt

    MePatchBody:
      type: object
      description: >
        Fields to update on the owner profile. All fields are optional;
        omitted fields are left unchanged.
      properties:
        username:
          type: string
          description: >
            Desired username. Server lowercases, validates format, checks reserved
            list, and enforces case-insensitive uniqueness.
        displayName:
          type: string
          nullable: true
          description: Display name (1–40 chars, trimmed). Null clears it.
        locationCity:
          type: string
          nullable: true
          description: City/location (0–60 chars, trimmed). Null or empty string clears it.
        about:
          type: string
          nullable: true
          description: About blurb (0–200 chars, trimmed). Null or empty string clears it.
        instagram:
          type: string
          nullable: true
          description: Instagram profile URL (max 200 chars). Null or empty string clears it.
        facebook:
          type: string
          nullable: true
          description: Facebook profile URL (max 200 chars). Null or empty string clears it.
        linkedin:
          type: string
          nullable: true
          description: LinkedIn profile URL (max 200 chars). Null or empty string clears it.
        xTwitter:
          type: string
          nullable: true
          description: X (Twitter) profile URL (max 200 chars). Null or empty string clears it.
        tiktok:
          type: string
          nullable: true
          description: TikTok profile URL (max 200 chars). Null or empty string clears it.
