openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: feed
    description: Feed operations
  - name: pets
    description: Pet operations
  - name: posts
    description: Post operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Get feed
      description: Returns recency-ordered posts with pet info, reaction counts, and viewer state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pets/{id}:
    get:
      operationId: getPet
      tags: [pets]
      summary: Get pet profile
      description: Returns a pet profile with its posts and reaction counts
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{id}/boops:
    post:
      operationId: boopPost
      tags: [posts]
      summary: Boop a post
      description: Inserts one boop event (unlimited, no dedupe). Returns the new boop count.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoopResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{id}/treats:
    post:
      operationId: treatPost
      tags: [posts]
      summary: Treat a post
      description: >
        In a single transaction: checks daily treat limit (config.daily_treat_limit, default 5),
        rejects self-treats (caller owns the post's pet), then inserts and returns the new
        treat count plus remaining treats for today.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreatResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Self-treat not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Daily treat limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pets:
    post:
      operationId: createPet
      tags: [pets]
      summary: Create a pet
      description: Creates a new pet owned by the authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePetBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/pets:
    get:
      operationId: getMyPets
      tags: [pets]
      summary: Get caller's pets
      description: Returns all pets owned by the authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPetsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{id}/comments:
    get:
      operationId: getPostComments
      tags: [posts]
      summary: Get post comments
      description: Returns comments on a post ordered by creation time
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostComment"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createComment
      tags: [posts]
      summary: Post a comment
      description: Creates a comment on a post and returns it with the author's username.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostComment"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    PetSummary:
      type: object
      description: Minimal pet info embedded in feed posts
      properties:
        id:
          type: string
        name:
          type: string
        species:
          type: string
        breed:
          type: string
          nullable: true
      required:
        - id
        - name
        - species

    ViewerInfo:
      type: object
      description: Viewer-specific state returned with the feed
      properties:
        treatsRemainingToday:
          type: integer
      required:
        - treatsRemainingToday

    FeedPost:
      type: object
      description: A post in the feed with reaction counts and viewer state
      properties:
        id:
          type: string
        caption:
          type: string
          nullable: true
        mediaKey:
          type: string
        isNursery:
          type: boolean
        createdAt:
          type: string
          format: date-time
        pet:
          $ref: "#/components/schemas/PetSummary"
        boopCount:
          type: integer
        treatCount:
          type: integer
        commentCount:
          type: integer
        viewerHasBooped:
          type: boolean
        viewerHasTreated:
          type: boolean
      required:
        - id
        - mediaKey
        - isNursery
        - createdAt
        - pet
        - boopCount
        - treatCount
        - commentCount
        - viewerHasBooped
        - viewerHasTreated

    FeedResponse:
      type: object
      description: Feed response wrapping posts and viewer state
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/FeedPost"
        viewer:
          $ref: "#/components/schemas/ViewerInfo"
      required:
        - posts
        - viewer

    PetProfile:
      type: object
      description: Full pet profile including posts
      properties:
        id:
          type: string
        name:
          type: string
        species:
          type: string
        breed:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        posts:
          type: array
          items:
            $ref: "#/components/schemas/FeedPost"
      required:
        - id
        - name
        - species
        - posts

    PostComment:
      type: object
      description: A comment on a post
      properties:
        id:
          type: string
        text:
          type: string
        authorUsername:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - text
        - authorUsername
        - createdAt

    CommentBody:
      type: object
      description: Request body for creating a comment
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 280
      required:
        - text

    Pet:
      type: object
      description: A pet owned by a user
      properties:
        id:
          type: string
        ownerId:
          type: string
        name:
          type: string
        species:
          type: string
        breed:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - ownerId
        - name
        - species
        - createdAt

    CreatePetBody:
      type: object
      description: Request body for creating a pet
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        species:
          type: string
          minLength: 1
          maxLength: 50
        breed:
          type: string
          maxLength: 100
        bio:
          type: string
          maxLength: 280
      required:
        - name
        - species

    MyPetsResponse:
      type: object
      description: The caller's pets
      properties:
        pets:
          type: array
          items:
            $ref: "#/components/schemas/Pet"
      required:
        - pets

    BoopResult:
      type: object
      description: Result of a boop action
      properties:
        boopCount:
          type: integer
      required:
        - boopCount

    TreatResult:
      type: object
      description: Result of a treat action
      properties:
        treatCount:
          type: integer
        treatsRemainingToday:
          type: integer
      required:
        - treatCount
        - treatsRemainingToday
