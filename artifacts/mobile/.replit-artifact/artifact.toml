kind = "mobile"
previewPath = "/"
title = "Fish Book"
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/mobile", "exec", "expo", "export", "--platform", "web", "--output-dir", "dist-web"]

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

[services.env]
PORT = "18115"
BASE_PATH = "/"
